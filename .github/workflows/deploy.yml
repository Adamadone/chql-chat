name: Deploy to Hetzner

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-convex:
    name: Deploy Convex functions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy Convex functions to production
        run: npx convex deploy --cmd "echo skip"
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PROD_DEPLOY_KEY }}

  deploy-server:
    name: Deploy Docker containers
    runs-on: ubuntu-latest
    needs: deploy-convex
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            set -e

            cd /opt/chql-chat

            git fetch origin main
            git reset --hard origin/main

            docker compose build --no-cache
            docker compose up -d

            docker image prune -f

            sleep 10
            curl -sf http://localhost:3001/health || (echo "MCP server health check failed" && exit 1)
            curl -sf http://localhost:3000 > /dev/null || (echo "Web app health check failed" && exit 1)

            echo "Deployment successful"
