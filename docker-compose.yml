services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        - NEXT_PUBLIC_CONVEX_URL=https://qualified-malamute-653.convex.cloud
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      mcp-server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - chql-network

  mcp-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.mcp
    ports:
      - "127.0.0.1:3001:3001"
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - MCP_PORT=3001
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - chql-network

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - mcp-server
    restart: unless-stopped
    networks:
      - chql-network

volumes:
  caddy_data:
  caddy_config:

networks:
  chql-network:
    driver: bridge
